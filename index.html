<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#020617" />
<title>Morpheus — записывай сны</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #020617;
    --surface: #0f172a;
    --border: #1e293b;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --text-faint: #475569;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  #app {
    max-width: 440px;
    height: 100dvh;
    margin: 0 auto;
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }

  .screen {
    flex: 1;
    overflow-y: auto;
    padding: 48px 20px 100px;
    display: none;
  }
  .screen.active { display: block; }
  .screen::-webkit-scrollbar { width: 0; }

  .feed-header { margin-bottom: 28px; }
  .feed-header h1 {
    font-size: 26px;
    font-weight: 300;
    letter-spacing: -0.02em;
    color: #f1f5f9;
  }
  .feed-header p {
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 4px;
    letter-spacing: 0.02em;
  }

  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-faint);
    font-size: 14px;
    line-height: 1.6;
  }

  .dream-card {
    margin-bottom: 22px;
    border-radius: 22px;
    overflow: hidden;
    border: 1px solid rgba(30, 41, 59, 0.6);
    background: rgba(15, 23, 42, 0.35);
    animation: cardIn 0.4s ease both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .dream-preview {
    aspect-ratio: 4 / 3;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
  }
  .dream-preview::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.06), transparent 70%);
    pointer-events: none;
  }
  .dream-preview .placeholder-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: rgba(148, 163, 184, 0.5);
    position: relative;
    z-index: 1;
  }
  .mood-tag {
    position: absolute;
    bottom: 12px;
    left: 14px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #cbd5e1;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(8px);
    padding: 4px 10px;
    border-radius: 999px;
    z-index: 2;
  }

  .mood-flight  { background: linear-gradient(135deg, #0c4a6e, #1e3a8a 50%, #0f172a) !important; }
  .mood-water   { background: linear-gradient(135deg, #134e4a, #155e75 50%, #0f172a) !important; }
  .mood-dark    { background: linear-gradient(135deg, #3b0764, #1e1b4b 50%, #000) !important; }
  .mood-neutral { background: linear-gradient(135deg, #1e293b, #0f172a) !important; }

  .dream-body { padding: 18px 18px 16px; }
  .dream-text {
    font-size: 14px;
    line-height: 1.6;
    color: #cbd5e1;
    margin-bottom: 16px;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .dream-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .dream-author {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-faint);
  }
  .author-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #334155;
  }
  .dream-actions {
    display: flex;
    gap: 16px;
  }
  .action-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 0;
    transition: color 0.2s;
    font-family: inherit;
  }
  .action-btn:hover, .action-btn.active { color: #e2e8f0; }
  .action-btn span:first-child { font-size: 14px; }

  .composer-greeting {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--text-faint);
    margin-bottom: 8px;
  }
  .composer-title {
    font-size: 30px;
    font-weight: 300;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: #f1f5f9;
    margin-bottom: 28px;
  }
  #dreamInput {
    width: 100%;
    min-height: 180px;
    background: rgba(15, 23, 42, 0.5);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    font-family: inherit;
    resize: vertical;
    transition: border-color 0.2s;
    outline: none;
  }
  #dreamInput::placeholder { color: var(--text-faint); }
  #dreamInput:focus { border-color: #475569; }

  .composer-actions { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .btn-primary {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    background: #f1f5f9;
    color: #020617;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    font-family: inherit;
  }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn-ghost {
    width: 100%;
    padding: 12px;
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 14px;
    cursor: pointer;
    transition: color 0.2s;
    font-family: inherit;
  }
  .btn-ghost:hover { color: var(--text-dim); }

  .profile-head {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 36px;
  }
  .profile-avatar {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: linear-gradient(135deg, #312e81, #1e293b);
    border: 1px solid #334155;
  }
  .profile-name { font-size: 18px; font-weight: 300; color: #f1f5f9; }
  .profile-stat { font-size: 12px; color: var(--text-faint); margin-top: 3px; }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--text-faint);
    margin-bottom: 14px;
  }

  .history-item {
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid rgba(30, 41, 59, 0.6);
    background: rgba(15, 23, 42, 0.25);
    margin-bottom: 10px;
  }
  .history-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .history-mood {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }
  .history-date { font-size: 10px; color: var(--text-faint); }
  .history-text {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-dim);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  #bottomNav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    border-top: 1px solid rgba(30, 41, 59, 0.6);
    background: rgba(2, 6, 23, 0.92);
    backdrop-filter: blur(16px);
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
  }
  .nav-row { display: flex; justify-content: space-around; align-items: center; }
  .nav-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 18px;
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    transition: color 0.2s;
    font-family: inherit;
  }
  .nav-btn.active { color: var(--text); }
  .nav-btn .icon { font-size: 20px; line-height: 1; }
  .nav-btn .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .nav-btn.center .icon { font-size: 22px; }

  #toast {
    position: absolute;
    top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-120%);
    background: rgba(30, 41, 59, 0.95);
    backdrop-filter: blur(12px);
    color: #e2e8f0;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 12px;
    white-space: nowrap;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">
  <div id="toast"></div>

  <section id="screen-feed" class="screen active">
    <header class="feed-header">
      <h1>Поток</h1>
      <p>Сны сообщества этим утром</p>
    </header>
    <div id="feedList"></div>
  </section>

  <section id="screen-compose" class="screen">
    <p class="composer-greeting">Доброе утро</p>
    <h2 class="composer-title">Что тебе<br/>снилось?</h2>
    <textarea id="dreamInput" placeholder="Опиши сон, пока он не растворился..."></textarea>
    <div class="composer-actions">
      <button id="generateBtn" class="btn-primary" disabled>Визуализировать сон</button>
      <button id="cancelBtn" class="btn-ghost">Позже</button>
    </div>
  </section>

  <section id="screen-profile" class="screen">
    <div class="profile-head">
      <div class="profile-avatar"></div>
      <div>
        <p class="profile-name">Твой профиль</p>
        <p class="profile-stat" id="profileCount">0 снов записано</p>
      </div>
    </div>
    <p class="section-label">История</p>
    <div id="historyList"></div>
  </section>

  <nav id="bottomNav">
    <div class="nav-row">
      <button class="nav-btn active" data-screen="feed">
        <span class="icon">◈</span>
        <span class="label">Поток</span>
      </button>
      <button class="nav-btn center" data-screen="compose">
        <span class="icon">✧</span>
        <span class="label">Записать</span>
      </button>
      <button class="nav-btn" data-screen="profile">
        <span class="icon">◇</span>
        <span class="label">Я</span>
      </button>
    </div>
  </nav>
</div>

<script>
const STORAGE_KEY = 'morpheus_dreams';
const MOODS = {
  flight:  { label: 'Полёт',    cls: 'mood-flight'  },
  water:   { label: 'Вода',     cls: 'mood-water'   },
  dark:    { label: 'Тревога',  cls: 'mood-dark'    },
  neutral: { label: 'Нейтральный', cls: 'mood-neutral' },
};

function loadDreams() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}
function saveDreams(dreams) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(dreams));
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function detectMood(text) {
  const t = text.toLowerCase();
  if (/полет|лета|летел|летела|парю|крыл/.test(t)) return 'flight';
  if (/вод|мор|океан|река|озер|плав|тонул|плава/.test(t)) return 'water';
  if (/страх|тревог|кошмар|ужас|тьм|паден|погон/.test(t)) return 'dark';
  return 'neutral';
}

function formatDate(iso) {
  try {
    return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  } catch { return ''; }
}

async function generateVideoReal(dreamText) {
  const startRes = await fetch('/api/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dreamText })
  });

  if (!startRes.ok) {
    const err = await startRes.json().catch(() => ({}));
    throw new Error(err.error || 'Ошибка запуска генерации');
  }

  const { predictionId } = await startRes.json();

  return new Promise((resolve, reject) => {
    const interval = setInterval(async () => {
      try {
        const statusRes = await fetch(`/api/status?id=${predictionId}`);
        const data = await statusRes.json();

        if (data.status === 'succeeded' && data.videoUrl) {
          clearInterval(interval);
          const moodKey = detectMood(dreamText);
          resolve({
            id: predictionId,
            text: dreamText.trim(),
            videoUrl: data.videoUrl,
            mood: moodKey,
            moodLabel: MOODS[moodKey].label,
            moodClass: MOODS[moodKey].cls,
            createdAt: new Date().toISOString(),
            resonances: 0,
          });
        } else if (data.status === 'failed') {
          clearInterval(interval);
          reject(new Error(data.error || 'Генерация не удалась'));
        }
      } catch (e) {
        clearInterval(interval);
        reject(e);
      }
    }, 3000);

    setTimeout(() => {
      clearInterval(interval);
      reject(new Error('Превышено время ожидания генерации'));
    }, 180000);
  });
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

let dreams = loadDreams();

function renderFeed() {
  const list = document.getElementById('feedList');
  if (dreams.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <p>Здесь пока тихо.</p>
        <p>Запиши свой сон первым.</p>
      </div>`;
    return;
  }
  list.innerHTML = dreams.map(d => {
    const previewContent = d.videoUrl
      ? `<video src="${d.videoUrl}" style="width:100%;height:100%;object-fit:cover;" autoplay loop muted playsinline></video>`
      : `<span class="placeholder-label">[Видео генерируется...]</span>`;
    return `
    <article class="dream-card">
      <div class="dream-preview ${d.moodClass}">
        ${previewContent}
        <span class="mood-tag">${escapeHtml(d.moodLabel)}</span>
      </div>
      <div class="dream-body">
        <p class="dream-text">${escapeHtml(d.text)}</p>
        <div class="dream-meta">
          <div class="dream-author">
            <div class="author-dot"></div>
            <span>Анонимный сновидец</span>
          </div>
          <div class="dream-actions">
            <button class="action-btn" data-resonate="${d.id}">
              <span>◈</span><span class="res-count">${d.resonances || 0}</span>
            </button>
            <button class="action-btn" data-echo="${d.id}">
              <span>↗</span><span>Отозвалось</span>
            </button>
          </div>
        </div>
      </div>
    </article>
  `;
  }).join('');
}

function renderProfile() {
  document.getElementById('profileCount').textContent = `${dreams.length} снов записано`;
  const hist = document.getElementById('historyList');
  if (dreams.length === 0) {
    hist.innerHTML = `<p class="empty-state" style="padding:30px 0">Твои сны появятся здесь.</p>`;
    return;
  }
  hist.innerHTML = dreams.map(d => `
    <div class="history-item">
      <div class="history-top">
        <span class="history-mood">${escapeHtml(d.moodLabel)}</span>
        <span class="history-date">${formatDate(d.createdAt)}</span>
      </div>
      <p class="history-text">${escapeHtml(d.text)}</p>
    </div>
  `).join('');
}

function renderAll() {
  renderFeed();
  renderProfile();
}

const navButtons = document.querySelectorAll('.nav-btn');
const screens = document.querySelectorAll('.screen');

function goTo(screenName) {
  screens.forEach(s => s.classList.toggle('active', s.id === `screen-${screenName}`));
  navButtons.forEach(b => b.classList.toggle('active', b.dataset.screen === screenName));

  const nav = document.getElementById('bottomNav');
  nav.style.display = screenName === 'compose' ? 'none' : '';

  if (screenName === 'compose') {
    setTimeout(() => document.getElementById('dreamInput').focus(), 50);
  } else if (screenName === 'feed') {
    renderFeed();
  } else if (screenName === 'profile') {
    renderProfile();
  }
}

navButtons.forEach(btn => {
  btn.addEventListener('click', () => goTo(btn.dataset.screen));
});

const input    = document.getElementById('dreamInput');
const genBtn   = document.getElementById('generateBtn');
const cancelBtn = document.getElementById('cancelBtn');

input.addEventListener('input', () => {
  genBtn.disabled = input.value.trim().length < 3;
});

genBtn.addEventListener('click', async () => {
  const text = input.value.trim();
  if (text.length < 3) return;

  genBtn.disabled = true;
  genBtn.textContent = 'Создаём видео (это займёт до минуты)...';

  try {
    const dream = await generateVideoReal(text);

    dreams.unshift(dream);
    saveDreams(dreams);

    input.value = '';
    genBtn.textContent = 'Визуализировать сон';
    showToast('Сон записан');
    renderAll();
    goTo('feed');
  } catch (error) {
    showToast(error.message || 'Ошибка генерации');
    genBtn.textContent = 'Попробовать снова';
    genBtn.disabled = false;
  }
});

cancelBtn.addEventListener('click', () => {
  input.value = '';
  genBtn.disabled = true;
  goTo('feed');
});

document.getElementById('feedList').addEventListener('click', (e) => {
  const resBtn = e.target.closest('[data-resonate]');
  if (resBtn) {
    const id = resBtn.dataset.resonate;
    const d = dreams.find(x => x.id === id);
    if (d) {
      d.resonances = (d.resonances || 0) + 1;
      saveDreams(dreams);
      renderFeed();
    }
    return;
  }

  const echoBtn = e.target.closest('[data-echo]');
  if (echoBtn) {
    echoBtn.classList.toggle('active');
    showToast('Отмечено как «отозвалось»');
  }
});

renderAll();
</script>
</body>
</html>
